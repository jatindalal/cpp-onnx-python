[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >= 2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "cpp-onnx-python"
version = "0.1.0"
description = "a packaged C++ inference library with Python bindings"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Jatin Dalal", email = "jd.jatindalal@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/jatindalal/cpp-onnx-python"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+. A single cp312-abi3 wheel runs on
# every later CPython, matching `requires-python = ">=3.12"`.
wheel.py-api = "cp312"

# Optional: only needed if you want to build wheels for other platforms
# locally (e.g. manylinux via Docker). GitHub Releases are the distribution
# channel; see scripts/release.sh.
[tool.cibuildwheel]
build-verbosity = 1
test-command = "pytest {project}/tests"
test-requires = ["pytest", "numpy"]
build = "cp312-*"
skip = "*-musllinux_*"

# Linux wheels bundle the CPU ONNX Runtime; the CUDA build is ~10x larger.
[tool.cibuildwheel.linux]
archs = ["aarch64", "x86_64"]

[tool.cibuildwheel.linux.environment]
CMAKE_ARGS = "-DCPP_ONNX_PYTHON_ORT_VARIANT=cpu"

# The bundled ONNX Runtime macOS binary requires macOS 14.0.
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "14.0"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
